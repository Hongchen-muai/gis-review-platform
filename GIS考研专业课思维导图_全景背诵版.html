              </div>
              <div class="item-footer-citation">
                <span>📖 知识点对应教材原书章节：${q.citation || sec.citation}</span>
              </div>
            </div>
          `;
        });
      }

      // Comparisons
      if (sec.comparisons && sec.comparisons.length > 0) {
        sec.comparisons.forEach(comp => {
          itemsHtml += `
            <div class="item-card item-type-comp" data-type="comp">
              <div class="item-header">
                <span class="tag-badge tag-comp">⚖️ 核心概念深度辨析</span>
                <span class="citation-badge">📚 ${comp.citation || sec.citation || '第8版教材'}</span>
              </div>
              <div class="item-title">${comp.item}</div>
              <div class="item-content" style="margin-top:8px;">
                <pre>${comp.content}</pre>
              </div>
              <div class="item-footer-citation">
                <span>📖 辨析理论源自：${comp.citation || sec.citation}</span>
              </div>
            </div>
          `;
        });
      }

      // Algorithms
      if (sec.algorithms_formulas && sec.algorithms_formulas.length > 0) {
        sec.algorithms_formulas.forEach(algo => {
          itemsHtml += `
            <div class="item-card item-type-algo" data-type="algo">
              <div class="item-header">
                <span class="tag-badge tag-algo">⚙️ 核心数理模型与公式</span>
                <span class="citation-badge">📚 ${sec.citation || '第8版教材'}</span>
              </div>
              <div class="item-title">${algo.name}</div>
              <div class="formula-box">
                $${algo.formula}$
              </div>
            </div>
          `;
        });
      }

      // Tips
      if (sec.memory_tips) {
        itemsHtml += `
          <div class="item-card item-type-tip" data-type="tip">
            <div class="item-header">
              <span class="tag-badge tag-tip">💡 记忆心法与背诵口诀</span>
            </div>
            <div class="item-content">
              <p style="font-weight:700; color:var(--tag-tip); font-size:0.92rem;">${sec.memory_tips}</p>
            </div>
          </div>
        `;
      }

      sectionsHtml += `
        <div class="section-block">
          <div class="section-title">
            <span>📌 ${sec.title}</span>
            <span class="citation-badge">${sec.citation || ''}</span>
          </div>
          <div class="section-items">
            ${itemsHtml}
          </div>
        </div>
      `;
    });

    card.innerHTML = `
      <div class="chapter-header" onclick="toggleChapterCard('${ch.id}')">
        <div class="chapter-header-info">
          <h2>
            <span>${ch.title}</span>
            <span class="cat-tag">${ch.category}</span>
          </h2>
        </div>
        <span id="chevron-${ch.id}" style="font-size:1.2rem; color:var(--text-muted); transition:transform 0.2s;">▼</span>
      </div>
      <div id="body-${ch.id}">
        <div class="macro-box">
          <strong>【📌 宏观框架逻辑与中科院839考点定位】</strong><br>
          ${ch.macro_logic}
        </div>
        ${sectionsHtml}
      </div>
    `;

    container.appendChild(card);
  });
}

function toggleChapterCard(chapId) {
  const body = document.getElementById(`body-${chapId}`);
  const chevron = document.getElementById(`chevron-${chapId}`);
  if (body.style.display === "none") {
    body.style.display = "block";
    chevron.style.transform = "rotate(0deg)";
    triggerMathJax();
  } else {
    body.style.display = "none";
    chevron.style.transform = "rotate(-90deg)";
  }
}

function expandAllChapters(expand) {
  chaptersData.forEach(ch => {
    const body = document.getElementById(`body-${ch.id}`);
    const chevron = document.getElementById(`chevron-${ch.id}`);
    if (body) {
      body.style.display = expand ? "block" : "none";
      chevron.style.transform = expand ? "rotate(0deg)" : "rotate(-90deg)";
    }
  });
  if (expand) triggerMathJax();
}

// Filter
function filterItems(type) {
  currentFilter = type;
  document.querySelectorAll(".filter-tab").forEach(tab => tab.classList.remove("active"));
  event.target.classList.add("active");

  const cards = document.querySelectorAll(".item-card");
  cards.forEach(card => {
    if (type === "all") {
      card.style.display = "block";
    } else if (type === "cas") {
      card.style.display = card.getAttribute("data-cas") === "true" ? "block" : "none";
    } else {
      card.style.display = card.getAttribute("data-type") === type ? "block" : "none";
    }
  });
  triggerMathJax();
}

// Tree
function renderMindmapTree() {
  const root = document.getElementById("mindmapTreeRoot");
  root.innerHTML = "";

  const categories = {};
  chaptersData.forEach(ch => {
    if (!categories[ch.category]) categories[ch.category] = [];
    categories[ch.category].push(ch);
  });

  const treeRoot = document.createElement("div");
  treeRoot.className = "mindmap-node";
  treeRoot.innerHTML = `
    <div class="node-header" style="background:var(--accent); color:#fff;" onclick="toggleTreeNode(this)">
      <span class="node-toggle" style="background:rgba(255,255,255,0.2); color:#fff;">-</span>
      <span class="node-title" style="font-size:0.95rem;">📘 《地理信息系统导论》全书考研知识架构总树（第8版·中科院839大纲）</span>
    </div>
    <div class="node-children"></div>
  `;
  const catContainer = treeRoot.querySelector(".node-children");

  for (const [catName, chList] of Object.entries(categories)) {
    const catNode = document.createElement("div");
    catNode.className = "mindmap-node";
    catNode.innerHTML = `
      <div class="node-header" style="background:var(--accent-light);" onclick="toggleTreeNode(this)">
        <span class="node-toggle">-</span>
        <span class="node-title" style="color:var(--accent); font-weight:700;">📂 ${catName}</span>
        <span class="node-tag" style="background:var(--bg-card);">${chList.length}个章节</span>
      </div>
      <div class="node-children"></div>
    `;
    const chContainer = catNode.querySelector(".node-children");

    chList.forEach(ch => {
      const chNode = document.createElement("div");
      chNode.className = "mindmap-node";
      chNode.innerHTML = `
        <div class="node-header" onclick="toggleTreeNode(this)">
          <span class="node-toggle">-</span>
          <span class="node-title">${ch.title}</span>
          <span class="node-tag" style="background:var(--bg-secondary); cursor:pointer;" onclick="event.stopPropagation(); inspectChapter('${ch.id}')">🔍 查看全章概况</span>
        </div>
        <div class="node-children"></div>
      `;
      const secContainer = chNode.querySelector(".node-children");

      ch.sections.forEach(sec => {
        const secNode = document.createElement("div");
        secNode.className = "mindmap-node";
        
        let counts = [];
        if (sec.concepts.length) counts.push(`${sec.concepts.length}名词`);
        if (sec.exam_questions.length) counts.push(`${sec.exam_questions.length}大题`);

        secNode.innerHTML = `
          <div class="node-header" onclick="toggleTreeNode(this)">
            <span class="node-toggle">+</span>
            <span class="node-title" style="font-weight:500; font-size:0.84rem;">${sec.title}</span>
            <span class="node-tag" style="background:var(--tag-term-bg); color:var(--tag-term);">${counts.join(' · ') || '重点'}</span>
          </div>
          <div class="node-children collapsed"></div>
        `;
        const itemContainer = secNode.querySelector(".node-children");

        // Concepts
        sec.concepts.forEach(c => {
          const itemDiv = document.createElement("div");
          itemDiv.className = "mindmap-node";
          itemDiv.innerHTML = `
            <div class="node-header" onclick="inspectConcept('${c.term.replace(/'/g, "\\'")}', '${c.definition.replace(/'/g, "\\'")}', '${c.citation || sec.citation}')">
              <span style="color:var(--tag-term);">🏷️</span>
              <span class="node-title" style="font-weight:normal; font-size:0.82rem;">${c.term}</span>
            </div>
          `;
          itemContainer.appendChild(itemDiv);
        });

        // Questions
        sec.exam_questions.forEach(q => {
          const itemDiv = document.createElement("div");
          itemDiv.className = "mindmap-node";
          const isCas = q.q.includes("839") || q.q.includes("中科院");
          const shortQ = q.q.length > 25 ? q.q.substring(0, 25) + "..." : q.q;
          itemDiv.innerHTML = `
            <div class="node-header" onclick="inspectQuestion('${q.q.replace(/'/g, "\\'")}', '${q.a.replace(/'/g, "\\'")}', '${q.citation || sec.citation}')">
              <span style="color:${isCas ? 'var(--cas-tag)' : 'var(--tag-exam)'};">${isCas ? '🏛️' : '📝'}</span>
              <span class="node-title" style="font-weight:normal; font-size:0.82rem; color:${isCas ? 'var(--cas-tag)' : 'var(--tag-exam)'};">${shortQ}</span>
            </div>
          `;
          itemContainer.appendChild(itemDiv);
        });

        secContainer.appendChild(secNode);
      });

      chContainer.appendChild(chNode);
    });

    catContainer.appendChild(catNode);
  }

  root.appendChild(treeRoot);
}

function toggleTreeNode(headerEl) {
  const children = headerEl.nextElementSibling;
  const toggleIcon = headerEl.querySelector(".node-toggle");
  if (!children) return;

  if (children.classList.contains("collapsed")) {
    children.classList.remove("collapsed");
    if (toggleIcon) toggleIcon.innerText = "-";
  } else {
    children.classList.add("collapsed");
    if (toggleIcon) toggleIcon.innerText = "+";
  }
}

function toggleAllTreeNodes(expand) {
  document.querySelectorAll(".node-children").forEach(el => {
    if (expand) el.classList.remove("collapsed");
    else el.classList.add("collapsed");
  });
  document.querySelectorAll(".node-toggle").forEach(el => {
    el.innerText = expand ? "-" : "+";
  });
}

// Drawer
function openDrawer(title, contentHtml) {
  document.getElementById("drawerTitle").innerText = title;
  document.getElementById("drawerBody").innerHTML = contentHtml;
  document.getElementById("detailDrawer").classList.add("open");
  triggerMathJax();
}
function closeDrawer() {
  document.getElementById("detailDrawer").classList.remove("open");
}

function inspectConcept(term, def, citation) {
  openDrawer("🏷️ 考研名词解释标准答案", `
    <div style="margin-bottom:16px;">
      <h3 style="font-size:1.05rem; color:var(--accent); margin-bottom:8px;">${term}</h3>
      <div style="background:var(--bg-secondary); padding:12px 16px; border-radius:8px; line-height:1.7; font-size:0.9rem;">
        ${def}
      </div>
      <div style="margin-top:12px; font-size:0.8rem; color:var(--text-muted); border-top:1px solid var(--border-color); padding-top:8px;">
        📖 教材原书出处：<strong>${citation}</strong>
      </div>
    </div>
  `);
}

function inspectQuestion(q, a, citation) {
  openDrawer("📝 经典考研大题采分方案", `
    <div style="margin-bottom:16px;">
      <h3 style="font-size:1rem; color:var(--tag-exam); margin-bottom:12px;">${q}</h3>
      <div style="background:var(--bg-secondary); padding:14px 16px; border-radius:8px; line-height:1.7; white-space:pre-line; font-size:0.88rem;">
        ${a}
      </div>
      <div style="margin-top:12px; font-size:0.8rem; color:var(--text-muted); border-top:1px solid var(--border-color); padding-top:8px;">
        📖 考点对应教材出处：<strong>${citation}</strong>
      </div>
    </div>
  `);
}

function inspectChapter(chapId) {
  const ch = chaptersData.find(c => c.id === chapId);
  if (!ch) return;
  let html = `
    <div style="margin-bottom:14px;">
      <div style="font-size:0.8rem; color:var(--accent); font-weight:700;">${ch.category}</div>
      <h3 style="font-size:1.1rem; margin-top:4px;">${ch.title}</h3>
      <div class="macro-box" style="margin:10px 0;">
        <strong>【📌 宏观框架逻辑】</strong><br>${ch.macro_logic}
      </div>
      <h4 style="margin:14px 0 8px; font-size:0.92rem;">本章考点小节目录与出处：</h4>
  `;
  ch.sections.forEach(s => {
    html += `
      <div style="border:1px solid var(--border-color); border-radius:6px; padding:9px; margin-bottom:8px; background:var(--bg-primary);">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <strong style="color:var(--text-main); font-size:0.86rem;">${s.title}</strong>
          <span style="font-size:0.72rem; color:var(--text-muted);">${s.citation || ''}</span>
        </div>
        <div style="font-size:0.78rem; color:var(--text-muted); margin-top:4px;">
          ${s.concepts.map(c => `<span style="display:inline-block; margin-right:8px;">• ${c.term}</span>`).join('')}
        </div>
      </div>
    `;
  });
  html += `</div>`;
  openDrawer("📖 章节全景解析", html);
}

// Search
function setupSearch() {
  const input = document.getElementById("searchInput");
  input.addEventListener("input", (e) => {
    const query = e.target.value.trim().toLowerCase();
    if (!query) {
      document.querySelectorAll(".item-card").forEach(c => c.style.display = "block");
      document.querySelectorAll(".chapter-card").forEach(c => c.style.display = "block");
      triggerMathJax();
      return;
    }

    switchView('handbook');

    document.querySelectorAll(".chapter-card").forEach(chapCard => {
      let hasMatch = false;
      const itemCards = chapCard.querySelectorAll(".item-card");
      itemCards.forEach(item => {
        const text = item.innerText.toLowerCase();
        if (text.includes(query)) {
          item.style.display = "block";
          hasMatch = true;
        } else {
          item.style.display = "none";
        }
      });

      if (hasMatch || chapCard.innerText.toLowerCase().includes(query)) {
        chapCard.style.display = "block";
        const chapId = chapCard.id.replace("chap-", "");
        const body = document.getElementById(`body-${chapId}`);
        if (body) body.style.display = "block";
      } else {
        chapCard.style.display = "none";
      }
    });
    triggerMathJax();
  });
}
</script>

</body>
</html>
