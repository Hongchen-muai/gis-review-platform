<!DOCTYPE html>
<html lang="zh-CN">
<head>

<style>
:root {
  --bg-primary: #f8fafc;
  --bg-card: #ffffff;
  --bg-secondary: #f1f5f9;
  --text-main: #0f172a;
  --text-muted: #64748b;
  --border-color: #e2e8f0;
  --accent: #1d4ed8;
  --accent-light: #eff6ff;
  --accent-hover: #1e40af;
  --cas-tag: #b91c1c;
  --cas-tag-bg: #fef2f2;
  --tag-term: #0284c7;
  --tag-term-bg: #e0f2fe;
  --tag-exam: #ea580c;
  --tag-exam-bg: #ffedd5;
  --tag-comp: #7c3aed;
  --tag-comp-bg: #f3e8ff;
  --tag-algo: #059669;
  --tag-algo-bg: #d1fae5;
  --tag-tip: #d97706;
  --tag-tip-bg: #fef3c7;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08);
  --shadow-lg: 0 10px 25px -3px rgba(0,0,0,0.12);
  --radius: 12px;
}

body[data-theme="dark"] {
  --bg-primary: #0f172a;
  --bg-card: #1e293b;
  --bg-secondary: #334155;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --border-color: #334155;
  --accent: #38bdf8;
  --accent-light: #0c4a6e;
  --accent-hover: #7dd3fc;
  --cas-tag: #f87171;
  --cas-tag-bg: #450a0a;
  --tag-term-bg: #0c4a6e;
  --tag-exam-bg: #7c2d12;
  --tag-comp-bg: #581c87;
  --tag-algo-bg: #064e3b;
  --tag-tip-bg: #78350f;
}

body[data-theme="eye"] {
  --bg-primary: #f0f7f4;
  --bg-card: #fafffc;
  --bg-secondary: #e2ede8;
  --text-main: #19382a;
  --text-muted: #4e6b5d;
  --border-color: #d1e3da;
  --accent: #1e704a;
  --accent-light: #d8ece2;
  --accent-hover: #145336;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background-color: var(--bg-primary);
  color: var(--text-main);
  line-height: 1.65;
  transition: background-color 0.2s ease, color 0.2s ease;
  overflow-x: hidden;
}

/* Navbar */
header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border-color);
  box-shadow: var(--shadow-sm);
  padding: 10px 20px;
}
.header-container {
  max-width: 1440px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}
.logo-area {
  display: flex;
  flex-direction: column;
}
.logo-title-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.logo-area h1 {
  font-size: 1.15rem;
  font-weight: 800;
  color: var(--accent);
  display: flex;
  align-items: center;
  gap: 6px;
}
.logo-area .subtitle {
  font-size: 0.78rem;
  color: var(--text-muted);
  font-weight: 500;
  margin-top: 2px;
}
.cas-badge {
  background: var(--cas-tag);
  color: #fff;
  padding: 2px 7px;
  border-radius: 4px;
  font-size: 0.7rem;
  font-weight: 700;
}

.nav-controls {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.search-wrapper {
  position: relative;
  min-width: 240px;
}
.search-input {
  width: 100%;
  padding: 7px 14px 7px 34px;
  border-radius: 20px;
  border: 1px solid var(--border-color);
  background: var(--bg-primary);
  color: var(--text-main);
  font-size: 0.85rem;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.search-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
}
.search-icon {
  position: absolute;
  left: 11px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 0.85rem;
}

.btn-group {
  display: flex;
  background: var(--bg-secondary);
  padding: 3px;
  border-radius: 8px;
  gap: 2px;
}
.btn-toggle {
  padding: 6px 12px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  border-radius: 6px;
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
  white-space: nowrap;
}
.btn-toggle.active {
  background: var(--bg-card);
  color: var(--accent);
  box-shadow: var(--shadow-sm);
}

.action-btn {
  padding: 6px 12px;
  border-radius: 6px;
  border: 1px solid var(--border-color);
  background: var(--bg-card);
  color: var(--text-main);
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: background 0.15s;
  white-space: nowrap;
}
.action-btn:hover { background: var(--bg-secondary); }

/* Mobile Menu Button */
.btn-mobile-menu {
  display: none;
  padding: 6px 10px;
  border-radius: 6px;
  border: 1px solid var(--border-color);
  background: var(--bg-card);
  font-size: 1.1rem;
  cursor: pointer;
  color: var(--accent);
}

/* Banner */
.stats-banner {
  background: var(--accent-light);
  color: var(--accent);
  font-size: 0.8rem;
  font-weight: 600;
  padding: 7px 16px;
  text-align: center;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

/* Layout */
.app-container {
  max-width: 1440px;
  margin: 0 auto;
  padding: 20px;
  display: flex;
  gap: 20px;
  min-height: calc(100vh - 120px);
}

/* Sidebar */
.sidebar {
  width: 290px;
  flex-shrink: 0;
  position: sticky;
  top: 80px;
  height: calc(100vh - 100px);
  overflow-y: auto;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow-sm);
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
.sidebar-title {
  font-size: 0.86rem;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 12px;
  display: flex;
  justify-content: space-between;
}
.chapter-nav-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.chapter-nav-item {
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 0.83rem;
  color: var(--text-main);
  text-decoration: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: background 0.15s;
}
.chapter-nav-item:hover {
  background: var(--bg-secondary);
  color: var(--accent);
}
.chapter-nav-item.active {
  background: var(--accent-light);
  color: var(--accent);
  font-weight: 700;
}
.badge-cat {
  font-size: 0.7rem;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--bg-secondary);
  color: var(--text-muted);
  margin-left: auto;
}

/* Mobile Sidebar Backdrop */
.sidebar-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  backdrop-filter: blur(2px);
  z-index: 998;
}

/* Content */
.content-area {
  flex: 1;
  min-width: 0;
}

/* Filter Bar */
.filter-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 18px;
  overflow-x: auto;
  white-space: nowrap;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 6px;
  scrollbar-width: none;
}
.filter-tabs::-webkit-scrollbar { display: none; }
.filter-tab {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 0.82rem;
  border: 1px solid var(--border-color);
  background: var(--bg-card);
  color: var(--text-muted);
  cursor: pointer;
  font-weight: 600;
  transition: all 0.15s;
  flex-shrink: 0;
}
.filter-tab:hover { border-color: var(--accent); color: var(--accent); }
.filter-tab.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.filter-tab.cas-special {
  border-color: var(--cas-tag);
  color: var(--cas-tag);
}
.filter-tab.cas-special.active {
  background: var(--cas-tag);
  color: #fff;
}

/* Mind Map Tree */
#view-mindmap {
  display: none;
}
.tree-container {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow-sm);
  overflow-x: auto;
}
.mindmap-node {
  margin-left: 16px;
  position: relative;
  padding: 4px 0 4px 14px;
  border-left: 2px solid var(--border-color);
}
.mindmap-node::before {
  content: "";
  position: absolute;
  left: 0;
  top: 15px;
  width: 12px;
  height: 2px;
  background: var(--border-color);
}
.node-header {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 6px 11px;
  background: var(--bg-primary);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.15s;
  user-select: none;
  max-width: 100%;
}
.node-header:hover {
  border-color: var(--accent);
  box-shadow: var(--shadow-sm);
}
.node-toggle {
  width: 18px;
  height: 18px;
  border-radius: 4px;
  background: var(--bg-secondary);
  color: var(--text-main);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: bold;
  flex-shrink: 0;
}
.node-title {
  font-size: 0.86rem;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
}
.node-tag {
  font-size: 0.7rem;
  padding: 2px 6px;
  border-radius: 4px;
  font-weight: 600;
  flex-shrink: 0;
}
.node-children {
  margin-left: 8px;
}
.node-children.collapsed {
  display: none;
}

/* Handbook View */
#view-handbook {
  display: block;
}
.chapter-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius);
  margin-bottom: 20px;
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.chapter-header {
  padding: 16px 20px;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border-color);
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
}
.chapter-header:hover {
  background: var(--bg-secondary);
}
.chapter-header-info h2 {
  font-size: 1.08rem;
  font-weight: 700;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.chapter-header-info .cat-tag {
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--accent);
  background: var(--accent-light);
  padding: 2px 7px;
  border-radius: 12px;
}
.macro-box {
  margin: 14px 20px 6px;
  padding: 12px 16px;
  background: var(--bg-primary);
  border-left: 4px solid var(--accent);
  border-radius: 4px;
  font-size: 0.86rem;
  color: var(--text-main);
  line-height: 1.65;
}

.section-block {
  padding: 16px 20px;
  border-top: 1px solid var(--border-color);
}
.section-title {
  font-size: 0.98rem;
  font-weight: 700;
  color: var(--text-main);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 6px;
}
.citation-badge {
  font-size: 0.72rem;
  font-weight: 500;
  color: var(--text-muted);
  background: var(--bg-secondary);
  padding: 2px 7px;
  border-radius: 4px;
  border: 1px solid var(--border-color);
}

/* Cards */
.item-card {
  margin-bottom: 14px;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-card);
  padding: 14px 18px;
  transition: transform 0.15s, box-shadow 0.15s;
}
.item-card:hover {
  box-shadow: var(--shadow-md);
}
.item-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
  flex-wrap: wrap;
  gap: 6px;
}
.tag-badge {
  font-size: 0.7rem;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  letter-spacing: 0.5px;
}
.tag-cas { background: var(--cas-tag-bg); color: var(--cas-tag); border: 1px solid #fca5a5; }
.tag-term { background: var(--tag-term-bg); color: var(--tag-term); }
.tag-exam { background: var(--tag-exam-bg); color: var(--tag-exam); }
.tag-comp { background: var(--tag-comp-bg); color: var(--tag-comp); }
.tag-algo { background: var(--tag-algo-bg); color: var(--tag-algo); }
.tag-tip { background: var(--tag-tip-bg); color: var(--tag-tip); }

.item-title {
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--text-main);
}
.item-content {
  font-size: 0.88rem;
  color: var(--text-main);
  line-height: 1.7;
}
.item-content p {
  margin-bottom: 6px;
}
.item-content pre {
  background: var(--bg-primary);
  padding: 10px 14px;
  border-radius: 6px;
  font-family: Menlo, Monaco, Consolas, monospace;
  font-size: 0.82rem;
  overflow-x: auto;
  margin-top: 6px;
  border: 1px solid var(--border-color);
  line-height: 1.5;
}
.item-footer-citation {
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px dashed var(--border-color);
  font-size: 0.76rem;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 6px;
}

/* Active Recall Mask */
.body-masked .answer-block {
  display: none;
}
.reveal-btn {
  display: none;
  margin-top: 8px;
  padding: 6px 14px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
}
.body-masked .reveal-btn {
  display: inline-block;
}
.answer-block.revealed {
  display: block !important;
}

/* Math formula box */
.formula-box {
  background: var(--bg-primary);
  border: 1px solid var(--border-color);
  border-left: 4px solid var(--tag-algo);
  border-radius: 6px;
  padding: 10px 14px;
  margin: 8px 0;
  overflow-x: auto;
}

/* Drawer */
.drawer {
  position: fixed;
  right: -520px;
  top: 0;
  width: 500px;
  height: 100vh;
  background: var(--bg-card);
  box-shadow: -5px 0 25px rgba(0,0,0,0.18);
  border-left: 1px solid var(--border-color);
  z-index: 1050;
  transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  padding: 24px;
  overflow-y: auto;
}
.drawer.open {
  right: 0;
}
.drawer-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  border-bottom: 1px solid var(--border-color);
  padding-bottom: 10px;
}
.drawer-title {
  font-size: 1.1rem;
  font-weight: 800;
  color: var(--accent);
}
.drawer-close {
  border: none;
  background: none;
  font-size: 1.5rem;
  cursor: pointer;
  color: var(--text-muted);
  padding: 4px 8px;
}

/* Mobile Bottom Navigation Bar */
.mobile-bottom-bar {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 56px;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--border-color);
  z-index: 990;
  justify-content: space-around;
  align-items: center;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
body[data-theme="dark"] .mobile-bottom-bar {
  background: rgba(30, 41, 59, 0.92);
}
body[data-theme="eye"] .mobile-bottom-bar {
  background: rgba(250, 255, 252, 0.92);
}
.mobile-nav-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
  color: var(--text-main);
  font-size: 0.72rem;
  font-weight: 600;
  cursor: pointer;
  padding: 4px 8px;
  gap: 2px;
}
.mobile-nav-btn span.icon {
  font-size: 1.1rem;
}

/* Responsive Breakpoints (Mobile Adaptation) */
@media (max-width: 900px) {
  header { padding: 8px 14px; }
  .header-container { gap: 8px; }
  .logo-area h1 { font-size: 1.02rem; }
  .logo-area .subtitle { display: none; }
  .btn-mobile-menu { display: inline-flex; }
  
  .nav-controls { width: 100%; justify-content: space-between; }
  .search-wrapper { flex: 1; min-width: 140px; }
  
  .app-container {
    padding: 12px;
    padding-bottom: 70px; /* space for bottom bar */
  }
  
  /* Off-canvas sidebar for mobile */
  .sidebar {
    position: fixed;
    top: 0;
    left: -310px;
    width: 290px;
    height: 100vh;
    z-index: 1000;
    border-radius: 0;
    box-shadow: var(--shadow-lg);
  }
  .sidebar.mobile-open {
    left: 0;
  }
  .sidebar-backdrop.mobile-open {
    display: block;
  }
  
  .chapter-header { padding: 14px 16px; }
  .chapter-header-info h2 { font-size: 0.98rem; }
  .macro-box { margin: 10px 14px 4px; padding: 10px 12px; font-size: 0.83rem; }
  .section-block { padding: 12px 14px; }
  .item-card { padding: 12px 14px; }
  .item-title { font-size: 0.92rem; }
  .item-content { font-size: 0.86rem; }
  
  /* Drawer full width on mobile */
  .drawer {
    width: 100vw;
    right: -100vw;
    padding: 20px 16px;
  }
  
  .mobile-bottom-bar {
    display: flex;
  }
}
</style>
</head>
<body data-theme="light">

<header>
  <div class="header-container">
    <div class="logo-area">
      <div class="logo-title-row">
        <button class="btn-mobile-menu" onclick="toggleMobileSidebar()" title="打开章节目录">📑</button>
        <h1>🗺️ GIS考研专业课复习平台</h1>
        <span class="cas-badge">中科院839</span>
      </div>
      <div class="subtitle">针对 Kang-tsung Chang《地理信息系统导论（原著第8版，陈健飞等译）》全书18章</div>
    </div>
    
    <div class="nav-controls">
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="全局搜索考点、839真题、算法...">
      </div>

      <div class="btn-group">
        <button class="btn-toggle active" id="btnModeHandbook" onclick="switchView('handbook')">📖 知识大纲</button>
        <button class="btn-toggle" id="btnModeMindmap" onclick="switchView('mindmap')">🌐 思维导图</button>
      </div>

      <button class="action-btn" id="btnFlashcard" onclick="toggleFlashcardMode()">🧠 自测</button>

      <div class="btn-group" id="themeGroup">
        <button class="btn-toggle active" onclick="setTheme('light')" title="日间模式">☀️</button>
        <button class="btn-toggle" onclick="setTheme('eye')" title="护眼绿">🍃</button>
        <button class="btn-toggle" onclick="setTheme('dark')" title="夜间模式">🌙</button>
      </div>
    </div>
  </div>
</header>

<div class="stats-banner">
